[env:m5stack-atoms3r]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    ; Control-core / comms-core split: Core 1 is the control core. The WiFi
    ; and lwIP tasks are pinned to Core 0 by the precompiled framework;
    ; async_tcp is the one networking task that floats to any core at
    ; priority 10 -- it preempted the control loop for 0.4-2.5s at a time
    ; (mid-balance Core 1 stalls, TUNING_HISTORY runs 173619/093643). Pin it
    ; to Core 0 with the rest of the networking stack and drop its priority.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_raw = no
monitor_echo = yes
upload_speed = 460800
upload_protocol = esp-builtin

; Match the tested control checkout; fresh builds must not upgrade motor/IMU dependencies.
lib_deps =
    m5stack/M5Unified@0.2.13
    https://github.com/m5stack/M5GFX.git#53a7184601f3667b030ba141c58b87ce2acfaa2a
    mathieucarbou/ESP Async WebServer@3.0.6
    mathieucarbou/Async TCP@3.1.4
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/Madgwick@1.2.0

lib_ignore =
    AsyncTCP_RP2040W
    ESPAsyncTCP-esphome
